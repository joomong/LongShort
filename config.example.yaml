# Personal research configuration template: `longshort start` copies this to ~/longshort_workspace/config.yaml
# when none exists. Data and the AFL catalog are shared; the backtest block matches the operating book.
# Prices (open high low close volume vwap cap) are raw;
# `returns`, `adj_returns` and `adj_factor` are cache fields (split-adjusted close = close / adj_factor).
# returns = total return (default signal + P&L), adj_returns = split-only; position moves in events.parquet.
# No top-level `events:` or backtest.corporate_actions block is allowed here.
base:
  cache: /home/base/cache/cache_v2_cash_1d
  groups: /home/base/cache/cache_v2_cash_1d/groups

afl:
  path: /home/base/cache/cache_v2_cash_1d/AflData
  catalog: /home/base/cache/cache_v2_cash_1d/afl_catalog.json

# Interval membership (universe, tradingItemId, fromDate, toDate); `name` selects the universe.
universe:
  path: /home/base/cache/cache_v2_cash_1d/universe.parquet
  names: [TOP3000, TOP3000_ADR, TOP2000, TOP2000_ADR, TOP1000, TOP1000_ADR, TOP500, TOP500_ADR, TOP1000_CAP, TOP500_CAP]

# start_date is the DATA load start (rows before it are dropped; modules see nothing earlier), not the
# simulation start. Each alpha picks its own simulation range in the UI (simStart / isStart / osStart,
# saved with the alpha), so keep this early enough for long warm-ups such as a 5-year PCA fit.
backtest:
  start_date: '2000-01-01'
  end_date: latest
  warmup_bars: 0
  initial_capital: 1000000
  transaction_fee: 1.5
  bars_per_year: 252
  execution_price: vwap
  missing_close_policy: carry

# Approved alpha pool (optional): the Corr column of the results table correlates a run with these alphas.
alpha_pool: alpha_pool
alpha_pool_universe: TOP500_CAP   # the pool standard (book universe); pool alphas are simulated with it once at startup
