# config.yaml (프로젝트 루트)
datasets:
  - name: pv
    path: Data/ohlcv/um_1d.parquet
    time_col: open_time
    symbol_col: symbol
    use_col: [open, high, low, close, volume] 

# Global symbols (applied to all datasets)
universe:
  - all

backtest:
  start_date: "2020-01-01"
  end_date: latest
  initial_capital: 1000000 #usdt
  transaction_fee: 5 # per trade bps
