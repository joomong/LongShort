# Current ALL-universe example on the thin-v1 rc2f3 cache. The historical
# cache_v2_cash_1d + Altaba events comparison is archived in the cache plan.
# The loader detects thin-v1 from base.cache/manifest.json. Its raw prices,
# signal returns, holding returns and position moves come from that one cache.
# Keep the existing monthly AFL source, group panels and backtest settings.
# The Altaba LIQ event (2665340) is in thin events on 2019-10-03; its
# returns_total on that date is 0.14009169638308738. Historical v2 inputs
# and exact historical universe membership remain archived in the plan.
base:
  cache: /home/base/cache/cache_v2_cash_1d
  groups: /home/base/cache/cache_v2_cash_1d/groups

datasets:
  - name: AFL
    enabled: true
    format: wide
    path: /home/base/cache/cache_v2_cash_1d/AflData
    catalog: afl_catalog.json
    lazy: true
    alignment: asof

# The thin cache stores interval membership. ALL keeps the original universe
# selection; use another name only when a different universe is intended.
universe:
  path: /home/base/cache/cache_v2_cash_1d/universe.parquet
  name: ALL

backtest:
  start_date: '2010-01-01'
  end_date: latest
  warmup_bars: 252
  initial_capital: 1000000
  transaction_fee: 1.5
  bars_per_year: 252
  combined_mode: normalized
  execution_price: ohlc4
  missing_close_policy: carry
