# Active Top500 equity example on the thin-v1 rc2f3 cache, with monthly AFL.
# The previous v1 wide-cache configuration is archived in the cache
# simplification plan. The loader selects the layout from cache/manifest.json.
base:
  cache: /home/base/cache/cache_v2_cash_1d
  groups: /home/base/cache/cache_v2_cash_1d/groups

datasets:
  - name: AFL
    enabled: true
    format: wide
    path: /home/base/cache/cache_v1_cash_1d/AflData_M
    catalog: afl_catalog.json
    lazy: true
    alignment: asof

# Named interval membership in the same thin cache.
universe:
  path: /home/base/cache/cache_v2_cash_1d/universe.parquet
  name: Top500

backtest:
  start_date: '2010-01-01'
  end_date: latest
  warmup_bars: 252
  initial_capital: 1000000
  transaction_fee: 1.5
  bars_per_year: 252
  combined_mode: normalized
  mode: 1
  missing_close_policy: carry
