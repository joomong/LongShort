# Thin-v1 cache (docs/backtest_cache_simplification_plan_2026-09-23.md §6): the loader detects
# the layout from `cache`/manifest.json. Prices (open high low close volume vwap cap) are raw;
# `returns` and `adj_factor` are cache fields (split-adjusted close = close / adj_factor).
# P&L uses the cache's returns_total and events, so this config has no `events:` block and no
# backtest.corporate_actions (both are refused with a thin cache).
base:
  cache: /home/jgo/longshort/simplify/thin/rc2f3
  groups: ../../../data/groups/cache_v2_cash_1d

datasets:
  - name: AFL
    enabled: true
    format: wide
    path: /home/base/cache/cache_v1_cash_1d/AflData_M
    catalog: afl_catalog.json
    lazy: true
    alignment: asof

# Interval membership (universe, tradingItemId, fromDate, toDate); `name` selects the universe.
universe:
  path: /home/jgo/longshort/simplify/thin/rc2f3/universe.parquet
  name: Top500

backtest:
  start_date: '2016-01-01'
  end_date: latest
  warmup_bars: 252
  initial_capital: 1000000
  transaction_fee: 5
  bars_per_year: 252
  combined_mode: normalized
  mode: 1
  missing_close_policy: carry
